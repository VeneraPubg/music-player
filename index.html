<!DOCTYPE html><!-- уточнение формата для браузера -->
<html lang="ru"><!-- Основной тег HTML и указание на язык страницы -->
<head><!-- Для технической информации -->
    <meta charset="UTF-8"> <!-- Коддировка -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- масштабирование для мобильных сутройств -->
    <title>Стартовый проект</title><!-- Название вкладки сайта -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- контейнер, чтобы был плеер не на весь экран -->
    <div class="container">
        <!-- Плеер -->
        <div class="player">
            <!-- Оболожка трека -->
            <div class="cover" id="cover"></div>
            <!-- Заголовок (название) трека -->
            <h2 id="title">С новым годом!</h2>
            <!-- таймлайн трека -->
            <input type="range" id="progress" value="0">
            <!-- Обертка для эл. управления -->


            <div class="volume-control">
                <span id="volumeIcon">🔊</span>
                <input type="range" 
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
                >
            </div>

            <div class="controls">
                <button id="shuffle">🔀</button>
                <button id="prev">⏪️</button>
                <button id="play">▶️</button>
                <button id="next">⏩️</button>
                <button id="repeat">🔁</button>
            </div>
        </div>

        <div class="track-list">
        </div>
    </div>
    <!-- Подключение скриптов -->
    <script src="script.js"></script>
</body>
</html>
